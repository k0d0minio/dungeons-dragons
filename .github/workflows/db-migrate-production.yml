# Apply checked-in migrations to the production database on merge to main
# (DND-013, hardened by DND-024).
#
# Runs on every push to main, not only ones that touch drizzle/: `drizzle-kit
# migrate` is a no-op when the database is already up to date, and a missed
# migration is far worse than a wasted minute.
#
# A missing DATABASE_URL fails the job. It used to degrade to a green tick with
# a warning, which meant a rotated or deleted secret would silently stop all
# migrations while every push still looked healthy (DND-024).
#
# **Known gap, chosen deliberately.** Vercel deploys from Git on the same push,
# so this job and the production deploy run in parallel — there is a window,
# usually under a minute, where new code is live against an un-migrated
# database. Closing it means letting Actions own the production deploy; the
# trade-off is written up in `.icm/docs/db-migrations-deploy.md`.
name: Database migrations (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

# One migration at a time, and never cancelled part-way through.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    # Currently ungated, so a merge migrates immediately. To require a human
    # click instead, add yourself as a required reviewer on this environment in
    # Settings → Environments → production. No change to this file.
    environment: production
    steps:
      # Fail loudly, first, before spending time on checkout and install. If
      # this push carried a schema change, production is now running code that
      # expects columns it does not have — a red job is the only honest signal.
      - name: Check for a production connection string
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error title=Migrations not applied::No DATABASE_URL secret on the production environment, so nothing can be migrated. Restore the secret (Settings → Environments → production) and re-run this job. See .icm/docs/db-migrations-deploy.md'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `migrate`, never `push`. `push` diffs against the live schema and will
      # happily drop a column it thinks is surplus.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

      - name: Report failure
        if: failure()
        run: |
          echo '::error title=Production migration failed::Some migrations may have applied and some not. Do not re-run blindly — read the recovery steps in .icm/docs/db-migrations-deploy.md first.'
